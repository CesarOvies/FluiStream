name: CI & Branch Governance

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  validate-governance:
    name: Gitflow Branch Governance
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Target from develop
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('PRs para a branch main só são aceitos a partir de develop!');

  build-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Web Tests
        run: |
          node tests/run-tests.js

      - name: Build Desktop Core
        run: |
          dotnet build src/desktop/FluiStream.Desktop.csproj -c Release --nologo
