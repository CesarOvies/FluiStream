# DEPRECATED (v1.1.0): Public Web distribution on GitHub Pages was discontinued in v1.1.0
# due to browser security/streaming constraints (Mixed Content, CORS 302 redirects, PNA ports,
# and lack of native MPEG-TS/AC3/EAC3 decoding). FluiStream now ships natively via Desktop
# Portable (.NET 10 + WebView2 + LibVLC) and Android APK (WebView + NativeBridge + Media3).
# Automatic deployment on push to `main` is disabled; only manual `workflow_dispatch` remains.

name: Deploy GitHub Pages (Deprecated)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Web Distribution
        run: |
          mkdir -p _site
          cp -r src/web/* _site/
          cp -r public/* _site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
