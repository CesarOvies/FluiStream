name: Release Automation & Security Scan

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v1.1.0). Vazio = auto-resolver pelo .csproj/tags'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Semver Tag & Version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag_name || '' }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="v${INPUT_TAG#v}"
          else
            CSPROJ_VER=$(grep -oPm1 '(?<=<Version>)[^<]+' src/desktop/FluiStream.Desktop.csproj)
            if [ -z "$CSPROJ_VER" ]; then
              echo "Could not read <Version> from FluiStream.Desktop.csproj" >&2
              exit 1
            fi
            HEAD_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            if [ -n "$HEAD_TAG" ]; then
              TAG="$HEAD_TAG"
            else
              CANDIDATE="v${CSPROJ_VER}"
              if ! git rev-parse -q --verify "refs/tags/${CANDIDATE}" >/dev/null; then
                TAG="$CANDIDATE"
              else
                MAJOR_MINOR=$(echo "$CSPROJ_VER" | awk -F. '{print $1"."$2}')
                LATEST_PATCH_TAG=$(git tag -l "v${MAJOR_MINOR}.*" | grep -E "^v${MAJOR_MINOR}\.[0-9]+$" | sort -V | tail -n1 || true)
                if [ -n "$LATEST_PATCH_TAG" ]; then
                  LAST_PATCH=${LATEST_PATCH_TAG##*.}
                  TAG="v${MAJOR_MINOR}.$((LAST_PATCH + 1))"
                else
                  TAG="${CANDIDATE}"
                fi
              fi
            fi
          fi

          VERSION="${TAG#v}"
          echo "Resolved release tag=$TAG version=$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Web Assets to Android
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          rm -rf src/android/app/src/main/assets/web
          mkdir -p src/android/app/src/main/assets/web
          cp -r src/web/* src/android/app/src/main/assets/web/
          python3 - <<'PY'
          import os, re
          ver = os.environ["RELEASE_VERSION"].lstrip("vV")
          patches = [
              ("src/android/app/src/main/assets/web/js/version.js",
               r"(export const APP_VERSION = ')[^']+(')",
               rf"\g<1>{ver}\g<2>"),
              ("src/android/app/src/main/assets/web/js/localization.js",
               r"(settingsVersion:\s*'[^']*?)\d+\.\d+\.\d+",
               rf"\g<1>{ver}"),
              ("src/android/app/src/main/assets/web/sw.js",
               r"(const CACHE_NAME = 'fluistream-v)[^']+(')",
               rf"\g<1>{ver}\g<2>"),
          ]
          for rel, pat, repl in patches:
              with open(rel, "r", encoding="utf-8") as f:
                  content = f.read()
              updated, count = re.subn(pat, repl, content)
              if count < 1:
                  raise SystemExit(f"Failed to stamp version in {rel}")
              with open(rel, "w", encoding="utf-8") as f:
                  f.write(updated)
          PY

      - name: Configure Android Release Signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_FILE="${{ runner.temp }}/fluistream-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "Configured persistent Android release keystore."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; falling back to ephemeral debug signing (in-place updates will conflict across releases)."
          fi

      - name: Build Release APK
        working-directory: src/android
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon -PversionName="$RELEASE_VERSION"
          else
            gradle assembleRelease --no-daemon -PversionName="$RELEASE_VERSION"
          fi

      - name: Verify APK Version Matches Release
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, subprocess, sys
          expected = os.environ["RELEASE_VERSION"].lstrip("vV")
          meta_path = "src/android/app/build/outputs/apk/release/output-metadata.json"
          with open(meta_path, "r", encoding="utf-8") as f:
              meta = json.load(f)
          elem = meta["elements"][0]
          actual = str(elem.get("versionName", ""))
          code = int(elem.get("versionCode", 0))
          print(f"APK metadata: versionName={actual} versionCode={code} expected={expected}")
          if actual != expected:
              sys.exit(f"APK versionName mismatch: got {actual!r}, expected {expected!r}")
          if code <= 2:
              sys.exit(f"APK versionCode must be > 2, got {code}")
          apks = glob.glob("src/android/app/build/outputs/apk/release/*.apk")
          if not apks:
              sys.exit("No release APK found")
          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          aapt2_list = sorted(glob.glob(os.path.join(sdk_root, "build-tools", "*", "aapt2")))
          if aapt2_list:
              out = subprocess.check_output([aapt2_list[-1], "dump", "badging", apks[0]], text=True)
              m = re.search(r"^package:\s+.*?versionName='([^']+)'", out, re.MULTILINE)
              if not m or m.group(1) != expected:
                  sys.exit(f"APK manifest versionName mismatch via aapt2: {m.group(1) if m else None!r} != {expected!r}")
              print(f"Verified APK binary manifest via aapt2: versionName={m.group(1)}")
          PY

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluiStream-Android-APK
          path: src/android/app/build/outputs/apk/release/*.apk

  build-release:
    name: Build Multi-OS Portables, Package APK & Defender Scan
    needs: [resolve-version, build-android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Tests
        shell: pwsh
        run: |
          node tests/run-tests.js
          dotnet build src/desktop/FluiStream.Desktop.csproj -c Release --nologo

      - name: Compile Multi-OS Portables via build-all.ps1
        shell: pwsh
        run: |
          ./build-all.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: FluiStream-Android-APK
          path: dist/android-apk

      - name: Stage Android APK & Update SHA-256 / SHA-512 Checksums
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-version.outputs.tag }}"
          $apkSource = Get-ChildItem -Path "dist/android-apk" -Filter "*.apk" | Select-Object -First 1
          if (-not $apkSource) {
            Write-Error "Android APK artifact not found in dist/android-apk"
            exit 1
          }
          $apkName = "FluiStream-$tag-android.apk"
          $apkDest = Join-Path "dist" $apkName
          Move-Item -Path $apkSource.FullName -Destination $apkDest -Force
          Remove-Item -Path "dist/android-apk" -Recurse -Force

          $h256 = (Get-FileHash -Path $apkDest -Algorithm SHA256).Hash
          $h512 = (Get-FileHash -Path $apkDest -Algorithm SHA512).Hash
          Add-Content -Path "dist/SHA256SUMS.txt" -Value "$h256  $apkName" -Encoding utf8
          Add-Content -Path "dist/SHA512SUMS.txt" -Value "$h512  $apkName" -Encoding utf8

      - name: Microsoft Defender Deep Scan
        shell: pwsh
        run: |
          $defenderPath = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (Test-Path $defenderPath) {
            Write-Host "Running Microsoft Defender deep scan on dist folder..."
            & $defenderPath -Scan -ScanType 3 -File "$pwd\dist"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Microsoft Defender scan detected threats or failed with code $LASTEXITCODE"
              exit 1
            }
            Write-Host "Defender scan passed: 0 threats detected."
          } else {
            Write-Warning "MpCmdRun.exe not found on runner."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "${{ needs.resolve-version.outputs.tag }} — FluiStream Multiplatform"
          files: |
            dist/*
          generate_release_notes: true
