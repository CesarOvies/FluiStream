<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1F38"/>
      <stop offset="55%" stop-color="#06101E"/>
      <stop offset="100%" stop-color="#040912"/>
    </linearGradient>
    <linearGradient id="rimAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="52%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06101E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="amberShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F97316" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Deep Navy Rounded Frame with Steel Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="10"/>

  <!-- Subtle Amber Inner Accent Rim -->
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="url(#rimAmberGrad)" stroke-width="3"/>

  <!-- Ambient Midnight Amber Radial Glow -->
  <circle cx="268" cy="256" r="170" fill="url(#amberGlow)"/>

  <!-- Dynamic Curved Chevron & Play Emblem -->
  <g filter="url(#amberShadow)">
    <!-- Fluid Stream Chevron Wing -->
    <path d="M 124 166
             C 132 156, 148 156, 158 166
             C 184 196, 202 226, 206 244
             C 209 252, 209 260, 206 268
             C 202 286, 184 316, 158 346
             C 148 356, 132 356, 124 346
             C 118 338, 120 326, 128 316
             C 148 292, 162 272, 162 256
             C 162 240, 148 220, 128 196
             C 120 186, 118 174, 124 166 Z"
          fill="url(#chevronGrad)"/>

    <!-- Primary Curved Play Chevron -->
    <path d="M 206 140
             C 218 132, 232 134, 246 142
             C 298 172, 344 202, 382 234
             C 396 246, 396 266, 382 278
             C 344 310, 298 340, 246 370
             C 232 378, 218 380, 206 372
             C 194 364, 194 348, 204 334
             C 224 306, 238 280, 238 256
             C 238 232, 224 206, 204 178
             C 194 164, 194 148, 206 140 Z"
          fill="url(#playGrad)"/>
  </g>
</svg>
