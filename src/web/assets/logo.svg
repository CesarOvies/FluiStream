<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#30363D" stroke-width="12"/>

  <!-- TV Antennas -->
  <path d="M192 110 L150 50" stroke="#8B949E" stroke-width="12" stroke-linecap="round"/>
  <circle cx="150" cy="50" r="10" fill="#10B981"/>
  <path d="M320 110 L362 50" stroke="#8B949E" stroke-width="12" stroke-linecap="round"/>
  <circle cx="362" cy="50" r="10" fill="#388BFD"/>

  <!-- TV Screen Border -->
  <rect x="76" y="112" width="360" height="280" rx="36" fill="#090D13" stroke="#21262D" stroke-width="8"/>

  <!-- Fluid Streaming Waves Shape (F + Play Icon Hybrid) -->
  <g filter="url(#glow)">
    <!-- Top Fluid Wave Ribbon -->
    <path d="M140 180 C220 150, 270 230, 350 190 C365 182, 380 195, 375 210 C365 240, 310 270, 240 230 C190 200, 160 215, 140 215 Z" fill="url(#streamGrad1)"/>
    <!-- Bottom Fluid Wave Ribbon -->
    <path d="M140 245 C210 245, 250 310, 330 275 C345 268, 360 280, 352 295 C335 328, 275 350, 210 310 C170 285, 150 290, 140 285 Z" fill="url(#streamGrad2)"/>
    
    <!-- Central Play Triangle in Glass Glow -->
    <polygon points="230,205 315,252 230,299" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Base Stand -->
  <path d="M216 410 L296 410" stroke="#30363D" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 392 L256 410" stroke="#30363D" stroke-width="14"/>
</svg>
